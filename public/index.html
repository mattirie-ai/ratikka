<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EAF4FA">
<title>Seuraava ratikka</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#EAF4FA; --sky2:#F8FBFD; --card:#FFFFFF; --ink:#1E2B45; --muted:#6B7A90; --rule:#E1E9F0;
  --l1:#5BB8E8; --l1-soft:#E3F3FC; --l1-ink:#1D6E9C;
  --l3:#34407A; --l3-soft:#E6E8F4; --l3-ink:#34407A;
  --ok:#2FA36B; --warn:#C77A1A; --rail:#C9D6E2;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{
  min-height:100vh; color:var(--ink);
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 55%,#FFFFFF 100%);
  font:400 16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
main{max-width:620px;margin:0 auto;padding:18px 16px 48px}

/* ---------- Yläosa ---------- */
.hero{position:relative;padding:6px 4px 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font:700 2.3rem/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:6px 0 4px;letter-spacing:.01em}
.sub{color:var(--muted);font-size:.95rem;margin:0}
.clock{background:var(--card);border-radius:14px;padding:8px 14px;box-shadow:0 2px 10px rgba(30,43,69,.06);
  font:700 1.7rem/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
/* ---------- Lähtökortit ---------- */
.board{display:grid;gap:14px}
.card{background:var(--card);border-radius:20px;padding:16px 18px 14px;
  box-shadow:0 1px 2px rgba(30,43,69,.04),0 8px 24px rgba(30,43,69,.06);border:1px solid var(--rule)}
.head{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center}
.badge{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:#fff;
  font:700 1.8rem/1 "Barlow Condensed","Arial Narrow",sans-serif}
.l1 .badge{background:var(--l1)} .l3 .badge{background:var(--l3)}
.from{font-weight:600;font-size:1.12rem;line-height:1.2}
.to{color:var(--muted);font-size:.95rem}
.to b{font-weight:600}
.l1 .to b{color:var(--l1-ink)} .l3 .to b{color:var(--l3-ink)}
.when{text-align:right}
.mins{font:700 2.7rem/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
.mins small{font-size:1.05rem;font-weight:600;margin-left:3px;color:var(--muted)}
.mins.now{color:var(--ok)}
.at{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:6px;justify-content:flex-end;align-items:center;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:#B9C4D0;flex:none}
.dot.rt{background:var(--ok);box-shadow:0 0 0 3px rgba(47,163,107,.18)}
.msg{color:var(--warn);font-size:.92rem;max-width:200px}

.later{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:.85rem;font-variant-numeric:tabular-nums;padding:3px 10px;border-radius:999px;color:var(--ink)}
.l1 .chip{background:var(--l1-soft)} .l3 .chip{background:var(--l3-soft)}
.chip.label{background:none!important;color:var(--muted);padding-left:0}

.status{margin:14px 6px 0;color:var(--muted);font-size:.86rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.legend{display:flex;align-items:center;gap:6px}

.status.warning{color:var(--warn)}
.card.stale{border-color:var(--warn)}
.stale-note{color:var(--warn);font-size:.85rem;margin-top:8px}
.hero{margin-bottom:20px}
</style>
</head>
<body>
<main>
  <section class="hero">
    <div class="top">
      <div>
        <h1>Seuraava ratikka</h1>
        <p class="sub">Tampere · linjat 1 ja 3</p>
      </div>
      <div class="clock" id="clock">--.--</div>
    </div>
  </section>

  <div class="board" id="board"></div>
  <div class="status">
    <span id="updated" role="status">Haetaan…</span>
    <span class="legend"><span class="dot rt"></span>reaaliaikainen <span class="dot" style="margin-left:8px"></span>aikataulu</span>
  </div>
  
</main>

<script>
// ---- Reitit: muokkaa tarvittaessa. "mista" = lähtöpysäkki, "minne" = pysäkki, jonka kautta ratikan pitää kulkea.
const REITIT = [
  { linja: "3", mista: "Hervantajärvi", minne: "Sorin aukio" },
  { linja: "3", mista: "Tulli",          minne: "Etelä-Hervanta" },
  { linja: "1", mista: "Tulli",          minne: "Pyynikintori" },
  { linja: "1", mista: "Tuulensuu",      minne: "Tays" },
  { linja: "1", mista: "Pyynikintori",   minne: "Tays" },
];
const PAIVITYSVALI_MS = 30000;
const $ = id => document.getElementById(id);
let tulokset = REITIT.map(() => ({ lahdot: [], virhe: null, haettu: null }));
let kaynnissa = false;
const VANHA_MS = 90000;
const nimi = s => (s || "").toLowerCase().normalize("NFC").replace(/\s+/g, " ").trim();
const kello = d => d.toLocaleTimeString("fi-FI", { hour: "2-digit", minute: "2-digit" });

async function haePysakki(pysakkinimi){
  const r = await fetch("/api/lahdot?pysakki=" + encodeURIComponent(pysakkinimi), { signal: AbortSignal.timeout(10000) });
  let j = {};
  try { j = await r.json(); } catch {}
  if (!r.ok) throw new Error(j.virhe || "Haku epäonnistui (HTTP " + r.status + ").");
  return j.pysakit || [];
}

function suodata(pysakit, reitti){
  const nyt = Date.now() / 1000, lahdot = [];
  for (const p of pysakit){
    for (const st of p.stoptimesWithoutPatterns || []){
      if (!st.trip || st.trip.route.shortName !== reitti.linja) continue;
      const nimet = (st.trip.stoptimes || []).map(x => nimi(x.stop.name));
      const i = nimet.findIndex(n => n.startsWith(nimi(reitti.mista)));
      if (i < 0 || !nimet.slice(i + 1).some(n => n.includes(nimi(reitti.minne)))) continue;
      const t = st.serviceDay + (st.realtime ? st.realtimeDeparture : st.scheduledDeparture);
      if (t >= nyt) lahdot.push({ t, rt: st.realtime });
    }
  }
  return lahdot.sort((a, b) => a.t - b.t);
}

async function paivita(){
  if (kaynnissa || document.hidden) return;
  kaynnissa = true;
  try {
    const vastaukset = {};
    await Promise.all([...new Set(REITIT.map(r => r.mista))].map(async n => {
      try { vastaukset[n] = { pysakit: await haePysakki(n) }; }
      catch { vastaukset[n] = { virhe: "Tietojen päivitys epäonnistui." }; }
    }));
    tulokset = REITIT.map((r, i) => {
      const v = vastaukset[r.mista];
      if (v.virhe) return { ...tulokset[i], virhe: v.virhe };
      if (!v.pysakit.length) return { ...tulokset[i], virhe: "Pysäkkiä ei löytynyt." };
      return { lahdot: suodata(v.pysakit, r), virhe: null, haettu: Date.now() };
    });
  } finally {
    kaynnissa = false;
    piirra();
  }
}

function piirra(){
  const board = $("board");
  const nyt = Date.now() / 1000;
  const html = REITIT.map((r, idx) => {
    const tul = tulokset[idx];
    const tulevat = tul.lahdot.filter(l => l.t >= nyt);
    const eka = tulevat[0];
    const vanha = !!tul.haettu && (!!tul.virhe || Date.now() - tul.haettu > VANHA_MS);
    let oikea;
    if (!eka) oikea = `<div class="msg">${tul.virhe ? "Ei ajantasaista tietoa" : tul.haettu ? "Ei lähtöjä lähiaikoina" : "Haetaan…"}</div>`;
    else {
      const sek = Math.max(0, eka.t - nyt), min = Math.floor(sek / 60);
      oikea = `<div class="mins ${min === 0 ? "now" : ""}">${min === 0 ? "&lt;1<small>min</small>" : min + "<small>min</small>"}</div>
               <div class="at"><span class="dot ${eka.rt ? "rt" : ""}"></span>${kello(new Date(eka.t * 1000))}</div>`;

    }
    const seur = tulevat.slice(1, 4).map(l => `<span class="chip">${kello(new Date(l.t * 1000))}</span>`).join("");
    return `<article class="card l${r.linja}${vanha ? " stale" : ""}">
      <div class="head">
        <div class="badge" aria-label="Linja ${r.linja}">${r.linja}</div>
        <div><div class="from">${r.mista}</div><div class="to">kohti <b>${r.minne}</b></div></div>
        <div class="when">${oikea}</div>
      </div>
      ${vanha ? `<div class="stale-note">Vanhentunut tieto · päivitetty ${kello(new Date(tul.haettu))}</div>` : ""}
      ${seur ? `<div class="later"><span class="chip label">Seuraavat</span>${seur}</div>` : ""}
    </article>`;
  }).join("");
  if (board.innerHTML !== html) board.innerHTML = html;
  const onnistuneet = tulokset.filter(t => t.haettu);
  const ongelma = tulokset.some(t => t.virhe || (t.haettu && Date.now() - t.haettu > VANHA_MS));
  const viimeisin = onnistuneet.length ? Math.min(...onnistuneet.map(t => t.haettu)) : null;
  const tila = ongelma
    ? (viimeisin ? "Kaikki tiedot eivät ole ajan tasalla" : "Päivitys epäonnistui · yritetään uudelleen")
    : viimeisin ? "Päivitetty " + kello(new Date(viimeisin)) : "Haetaan…";
  if ($("updated").textContent !== tila) $("updated").textContent = tila;
  $("updated").parentElement.classList.toggle("warning", ongelma);
}

function tikitys(){ $("clock").textContent = kello(new Date()); piirra(); }

tikitys(); paivita();
setInterval(tikitys, 1000);
setInterval(paivita, PAIVITYSVALI_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) paivita(); });
</script>
</body>
</html>
